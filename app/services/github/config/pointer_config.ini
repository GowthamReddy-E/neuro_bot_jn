# Pointer module configuration
# Each section defines a branch to monitor for pointer file values.
#
# repo             = GitHub org/repo
# branch           = branch name
# files            = comma-separated file paths to read
# keys             = comma-separated variable names to extract (raw)
# display          = combined display format: LABEL=VERSION_KEY.BUILD_KEY
# alias            = comma-separated aliases for bot commands
# build_file       = path to BUILD number file in the repo
# jenkins_url      = Jenkins job URL for this branch
# jenkins_instance = Jenkins instance name (for credentials lookup)
# report_path      = URL suffix for Component Version Report
# notify           = comma-separated emails to tag when pointers are stale
# stale_days       = number of days after which pointers are considered stale (default: 2)

[IMS_10_5]
repo = cisco-sbg-emu/netsec-ims
branch = IMS_10_5_MAIN
files = product/ASABUILD, product/FXOSBUILD
keys = ASABUILD, ASAVERSION, FXOS_BUILD, FXOS_BRANCH
display = ASA=ASAVERSION.ASABUILD, FXOS=FXOS_BRANCH.FXOS_BUILD
alias = ims_10_5, ims10.5, ims_pointer, ims, ims105, 10.5, 10_5, ims_10_5_main
build_file = product/BUILD
jenkins_url = https://engci-private-rtp.cisco.com/jenkins/ftd-asa/job/IMS/job/netsec-ims/job/IMS_10_5_MAIN/
jenkins_instance = ftd-asa
report_path = Component_20Version_20Report/
notify = gowe@cisco.com
stale_days = 2

[LINA_10_5]
repo = cisco-sbg-emu/netsec-ims
branch = 10_5_0-LINA
files = product/ASABUILD, product/FXOSBUILD
keys = ASABUILD, ASAVERSION, FXOS_BUILD, FXOS_BRANCH
display = ASA=ASAVERSION.ASABUILD, FXOS=FXOS_BRANCH.FXOS_BUILD
alias = lina_10_5, lina10.5, lina_pointer, lina, lina105, lina_10_5_main, 10_5_lina, 10.5_lina
build_file = product/BUILD
jenkins_url = https://engci-private-rtp.cisco.com/jenkins/ftd-asa/job/IMS/job/netsec-ims/job/10_5_0-LINA/
jenkins_instance = ftd-asa
report_path = Component_20Version_20Report/
notify = gowe@cisco.com
stale_days = 2

# Compare groups: define pairs of sections to compare side-by-side
# Format: group_name = SECTION1, SECTION2
# alias_<group_name> = comma-separated aliases that trigger this compare
[COMPARE_GROUPS]
ims_vs_lina = IMS_10_5, LINA_10_5
alias_ims_vs_lina = 10.5, 10_5, ims_vs_lina, compare
