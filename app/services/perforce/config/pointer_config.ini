# Pointer module configuration — Perforce sources
# Each section defines a branch to monitor for pointer file values from Perforce.
#
# depot_base       = P4 depot base path (e.g. //depot/firepower/ims)
# p4_port          = P4 server address (optional, defaults to ssl:sbg-perforce.esl.cisco.com:1666)
# branch           = branch/stream name in depot
# files            = comma-separated file paths to read (relative to depot_base/branch/)
# keys             = comma-separated variable names to extract (raw)
# display          = combined display format: LABEL=VERSION_KEY.BUILD_KEY
# alias            = comma-separated aliases for bot commands
# build_file       = path to BUILD number file
# jenkins_url      = Jenkins job URL for this branch
# jenkins_instance = Jenkins instance name (for credentials lookup)
# report_path      = URL suffix for Component Version Report
# notify           = comma-separated emails to tag when pointers are stale
# stale_days       = number of days after which pointers are considered stale (default: 2)

[IMS_10_1]
depot_base = //depot/firepower/ims
branch = IMS_10_1_MAIN
files = product/ASABUILD, product/FXOSBUILD
keys = ASABUILD, ASAVERSION, FXOS_BUILD, FXOS_BRANCH
display = ASA=ASAVERSION.ASABUILD, FXOS=FXOS_BRANCH.FXOS_BUILD
alias = ims_10_1, ims10.1, 10.1_ims, ims_10_1_main
build_file = product/BUILD
jenkins_url = https://engci-private-rtp.cisco.com/jenkins/ftd-asa/job/IMS/job/IMS_BUILD/job/IMS_10_1_MAIN/
jenkins_instance = ftd-asa
report_path = Component_20Version_20Report/
notify = gowe@cisco.com, user2@cisco.com
stale_days = 1

[LINA_10_1]
depot_base = //depot/firepower/ims
branch = 10_1_0-LINA
files = product/ASABUILD, product/FXOSBUILD
keys = ASABUILD, ASAVERSION, FXOS_BUILD, FXOS_BRANCH
display = ASA=ASAVERSION.ASABUILD, FXOS=FXOS_BRANCH.FXOS_BUILD
alias = lina_10_1, lina10.1, 10.1_lina, lina_10_1_main
build_file = product/BUILD
jenkins_url = https://engci-private-rtp.cisco.com/jenkins/firepower-build/job/IMS/job/10_1_0-LINA/job/CHECKOUT/
jenkins_instance = ftd-asa
report_path = Component_20Version_20Report/
notify = gowe@cisco.com, user2@cisco.com
stale_days = 1

# Compare groups: define pairs of sections to compare side-by-side
[COMPARE_GROUPS]
ims_vs_lina_10_1 = IMS_10_1, LINA_10_1
alias_ims_vs_lina_10_1 = 10.1, 10_1
